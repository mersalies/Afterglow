# spotifyd for Afterglow: plays Spotify in the background, no Spotify window.
# Copy to ~/.config/spotifyd/spotifyd.conf, then: spotifyd authenticate
[global]
# Afterglow looks for this name in your Spotify devices ("spotifyDevice" in its config).
device_name = "Afterglow"
device_type = "computer"

# PipeWire answers on the PulseAudio socket. If `spotifyd --help` lists no
# "pulseaudio" backend, use "alsa".
backend = "pulseaudio"
bitrate = 320
initial_volume = 80
volume_normalisation = true

# Track info and play/pause/next for Afterglow, playerctl, media keys.
use_mpris = true
dbus_type = "session"
